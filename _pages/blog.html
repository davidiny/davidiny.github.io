---
title: "Blog"
permalink: /blog/
author_profile: true
---

{% for post in site.posts %}
  <article class="archive__item">
    <h2 class="archive__item-title">
      <a href="{{ post.url }}">{{ post.title }}</a>
    </h2>

    <p>
      <small>{{ post.date | date: "%B %-d, %Y" }}</small>
    </p>

    {% if post.excerpt %}
      <p>{{ post.excerpt }}</p>
    {% endif %}
  </article>
{% endfor %}
